stages:
  - lint
  - test
  - build

default:
  image: golang:1.26
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go-mod-cache/
      - .go-build-cache/
  before_script:
    - export GOMODCACHE="${CI_PROJECT_DIR}/.go-mod-cache"
    - export GOCACHE="${CI_PROJECT_DIR}/.go-build-cache"

lint:
  stage: lint
  script:
    - go vet ./...
    - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

test:
  stage: test
  script:
    - go test -race ./...

build:
  stage: build
  script:
    - go build ./cmd/tea-eyes

snapshot:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  script:
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/

release:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  script:
    - goreleaser release --clean
  artifacts:
    paths:
      - dist/
