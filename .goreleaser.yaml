version: 2

project_name: tea-eyes

before:
  hooks:
    - go mod tidy

builds:
  - id: tea-eyes
    main: ./cmd/tea-eyes
    binary: tea-eyes
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/skjutare/tea-eyes/internal/server.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: tea-eyes
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - plugin/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  draft: true
  prerelease: auto
  name_template: "tea-eyes v{{.Version}}"
  header: |
    Release notes derived from `CHANGELOG.md` `[Unreleased]` section before
    tagging — see CHANGELOG for the canonical, curated entry.
